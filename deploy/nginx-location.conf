    # --- SRNI Dashboard (Django) -> 127.0.0.1:8089 ---------------------------
    # Pegar dentro del bloque server de
    # /etc/nginx/sites-available/sinapsis.unidadvictimas.gov.co
    # (por ejemplo, justo antes de "# ✅ HEALTH CHECK").
    location = /srni-dashboard {
        return 301 /srni-dashboard/;
    }
    location /srni-dashboard/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 12m;   # evidencias de hasta 10 MB
    }
